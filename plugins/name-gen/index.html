<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name Generator — Charactry</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg:#0e0e14;--bg2:#13131c;--bg3:#1a1a28;--card:#16161f;
    --border:#2a2a3d;--accent:#a78bfa;--accent2:#7c3aed;
    --accent-glow:rgba(167,139,250,0.18);
    --text:#e8e6f0;--text2:#9b98b0;--text3:#5a5870;
    --danger:#f87171;--success:#4ade80;--radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;overflow:hidden}
  ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:10px}

  #root{display:flex;flex-direction:column;height:100vh}

  /* Titlebar */
  #titlebar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;border-bottom:1px solid var(--border);flex-shrink:0;-webkit-app-region:drag}
  #titlebar-left{display:flex;align-items:center;gap:10px}
  .title-icon{color:var(--accent);display:flex}
  h1{font-family:'Cinzel',serif;font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{font-size:11px;color:var(--text3);margin-top:1px}

  /* Body: sidebar + main */
  #body{display:flex;flex:1;overflow:hidden}

  /* Style sidebar */
  #style-sidebar{width:200px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;-webkit-app-region:no-drag}
  #style-search{margin:10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-family:'Nunito',sans-serif;font-size:12px;outline:none}
  #style-search:focus{border-color:var(--accent)}
  #genre-filters{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 8px;border-bottom:1px solid var(--border)}
  .genre-btn{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text3);font-family:'Nunito',sans-serif;transition:all .15s}
  .genre-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  #style-list{flex:1;overflow-y:auto;padding:6px}
  .style-item{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text2);transition:all .15s;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .style-item:hover{background:var(--bg3);color:var(--text)}
  .style-item.active{background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent)}
  .style-item .genre-tag{font-size:9px;background:var(--bg3);padding:1px 5px;border-radius:10px;color:var(--text3);border:1px solid var(--border);flex-shrink:0}
  .style-item.active .genre-tag{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}

  /* Main panel */
  #main{flex:1;display:flex;flex-direction:column;overflow:hidden;-webkit-app-region:no-drag}

  /* Controls */
  #controls{padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
  #controls-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .ctrl-group{display:flex;flex-direction:column;gap:4px}
  .ctrl-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px}
  .ctrl-select{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-family:'Nunito',sans-serif;font-size:13px;outline:none;transition:border-color .15s;cursor:pointer}
  .ctrl-select:focus{border-color:var(--accent)}
  .ctrl-input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-family:'Nunito',sans-serif;font-size:13px;outline:none;width:60px;transition:border-color .15s}
  .ctrl-input:focus{border-color:var(--accent)}
  #options-row{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .toggle-label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--text2);user-select:none}
  .toggle-label input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}

  /* Results */
  #results-area{flex:1;overflow:hidden;display:flex;flex-direction:column}
  #results-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;flex-shrink:0}
  #results-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
  #results-actions{display:flex;gap:6px}
  #results-scroll{flex:1;overflow-y:auto;padding:0 20px 16px}
  #results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .result-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:border-color .15s;cursor:default}
  .result-card:hover{border-color:var(--accent)}
  .result-name{font-size:15px;font-weight:700;color:var(--text)}
  .result-sub{font-size:10px;color:var(--text3);margin-top:2px}
  .result-btns{display:flex;gap:4px;flex-shrink:0}

  /* History */
  #history-panel{width:220px;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  #history-header{padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  #history-scroll{flex:1;overflow-y:auto;padding:6px}
  .history-item{padding:7px 10px;border-radius:8px;cursor:pointer;transition:all .15s;border:1px solid transparent}
  .history-item:hover{background:var(--bg3);border-color:var(--border)}
  .history-name{font-size:12px;font-weight:700;color:var(--text)}
  .history-meta{font-size:10px;color:var(--text3);margin-top:1px}
  .history-empty{padding:20px;text-align:center;font-size:12px;color:var(--text3)}

  /* Buttons */
  .btn{padding:7px 16px;border:none;border-radius:8px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .btn-primary:hover{opacity:.88}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-sm{padding:4px 9px;font-size:11px}
  .btn-icon{padding:4px 6px;font-size:11px}

  /* Empty */
  #empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--text3);text-align:center;padding:40px}
  #empty .empty-icon{font-size:40px;opacity:.25}

  /* Toast */
  #toast-wrap{position:fixed;bottom:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .toast{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:12px;font-weight:600;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tIn .18s ease;pointer-events:auto}
  .toast.success{border-color:var(--success)}.toast.error{border-color:var(--danger)}
  @keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="root">

  <div id="titlebar">
    <div id="titlebar-left">
      <div class="title-icon">
        <img src="name-gen.svg" style="width:20px;height:20px;filter:brightness(0) saturate(100%) invert(72%) sepia(50%) saturate(500%) hue-rotate(210deg)" onerror="this.style.display='none';document.getElementById('title-lucide').style.display='flex'">
        <span id="title-lucide" style="display:none"><i data-lucide="sparkles" style="width:20px;height:20px"></i></span>
      </div>
      <div>
        <h1>Name Generator</h1>
        <div class="subtitle" id="style-subtitle">Select a style from the left</div>
      </div>
    </div>
    <div style="-webkit-app-region:no-drag">
      <button class="btn btn-primary" onclick="generate()" id="gen-btn">
        <i data-lucide="sparkles" style="width:13px;height:13px"></i> Generate
      </button>
    </div>
  </div>

  <div id="body">

    <!-- Style sidebar -->
    <div id="style-sidebar">
      <input id="style-search" placeholder="Search styles…" oninput="renderStyleList()">
      <div id="genre-filters"></div>
      <div id="style-list"></div>
    </div>

    <!-- Main -->
    <div id="main">
      <div id="controls">
        <div id="controls-row">
          <div class="ctrl-group">
            <div class="ctrl-label">Gender</div>
            <select class="ctrl-select" id="ctrl-gender">
              <option value="any">✦ Any</option>
              <option value="m">♂ Male</option>
              <option value="f">♀ Female</option>
              <option value="n">⚧ Neutral</option>
            </select>
          </div>
          <div class="ctrl-group">
            <div class="ctrl-label">Count</div>
            <input class="ctrl-input" type="number" id="ctrl-count" value="10" min="1" max="50">
          </div>
          <div class="ctrl-group">
            <div class="ctrl-label">Format</div>
            <select class="ctrl-select" id="ctrl-format">
              <option value="first">First only</option>
              <option value="full">First + Surname</option>
              <option value="sur">Surname only</option>
              <option value="compound">Compound / Hyphenated</option>
              <option value="title">With Title / Honorific</option>
            </select>
          </div>
          <div class="ctrl-group">
            <div class="ctrl-label">Length</div>
            <select class="ctrl-select" id="ctrl-length">
              <option value="any">Any</option>
              <option value="short">Short (≤5 chars)</option>
              <option value="medium">Medium (6–9)</option>
              <option value="long">Long (10+)</option>
            </select>
          </div>
        </div>
        <div id="options-row">
          <label class="toggle-label"><input type="checkbox" id="opt-unique" checked> Unique only</label>
          <label class="toggle-label"><input type="checkbox" id="opt-apostrophe"> Allow apostrophes</label>
          <label class="toggle-label"><input type="checkbox" id="opt-mixgender"> Mix genders</label>
        </div>
      </div>

      <div id="results-area">
        <div id="results-header">
          <span id="results-label">Results</span>
          <div id="results-actions">
            <button class="btn btn-ghost btn-sm" onclick="copyAll()" id="copy-all-btn" style="display:none">
              <i data-lucide="clipboard-copy" style="width:11px;height:11px"></i> Copy All
            </button>
            <button class="btn btn-ghost btn-sm" onclick="clearResults()">
              <i data-lucide="x" style="width:11px;height:11px"></i> Clear
            </button>
          </div>
        </div>
        <div id="results-scroll">
          <div id="empty">
            <div class="empty-icon">✦</div>
            <div style="font-size:13px">Pick a style and hit Generate</div>
          </div>
          <div id="results-grid" style="display:none"></div>
        </div>
      </div>
    </div>

    <!-- History panel -->
    <div id="history-panel">
      <div id="history-header">
        <span>Saved</span>
        <button class="btn btn-ghost btn-sm btn-icon" onclick="clearHistory()" title="Clear saved names">
          <i data-lucide="trash-2" style="width:11px;height:11px"></i>
        </button>
      </div>
      <div id="history-scroll">
        <div class="history-empty" id="history-empty">No saved names yet.<br>Click ♡ to save.</div>
      </div>
    </div>

  </div>
</div>
<div id="toast-wrap"></div>

/* ══════════════════════════════════════════════

══════════════════════════════════════════════ */
let activeStyle   = STYLES[0];
let activeGenre   = 'All';
let results       = [];
let savedNames    = JSON.parse(localStorage.getItem('ng_saved') || '[]');

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  buildGenreFilters();
  renderStyleList();
  renderHistory();
  lucide.createIcons();
});

/* ══════════════════════════════════════════════
   UI BUILDERS
══════════════════════════════════════════════ */
function buildGenreFilters() {
  const wrap = document.getElementById('genre-filters');
  wrap.innerHTML = GENRES.map(g =>
    `<button class="genre-btn ${g === activeGenre ? 'active' : ''}" onclick="setGenre('${g}')">${g}</button>`
  ).join('');
}

function setGenre(g) {
  activeGenre = g;
  buildGenreFilters();
  renderStyleList();
}

function renderStyleList() {
  const q      = document.getElementById('style-search').value.trim().toLowerCase();
  const list   = document.getElementById('style-list');
  const filtered = STYLES.filter(s => {
    const matchGenre = activeGenre === 'All' || s.genre === activeGenre;
    const matchQ     = !q || s.label.toLowerCase().includes(q) || s.genre.toLowerCase().includes(q);
    return matchGenre && matchQ;
  });

  if (!filtered.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:var(--text3)">No styles found.</div>';
    return;
  }

  list.innerHTML = filtered.map(s =>
    `<div class="style-item ${s.id === activeStyle?.id ? 'active' : ''}" onclick="selectStyle('${s.id}')">
      <span>${s.label}</span>
      <span class="genre-tag">${s.genre}</span>
    </div>`
  ).join('');
}

function selectStyle(id) {
  activeStyle = STYLES.find(s => s.id === id) || STYLES[0];
  document.getElementById('style-subtitle').textContent = `${activeStyle.label} · ${activeStyle.genre}`;
  renderStyleList();
}

/* ══════════════════════════════════════════════
   GENERATION
══════════════════════════════════════════════ */
function generate() {
  if (!activeStyle) { toast('Pick a style first!', 'error'); return; }

  const gender    = document.getElementById('ctrl-gender').value;
  const count     = Math.min(50, Math.max(1, parseInt(document.getElementById('ctrl-count').value) || 10));
  const format    = document.getElementById('ctrl-format').value;
  const length    = document.getElementById('ctrl-length').value;
  const uniqueOnly= document.getElementById('opt-unique').checked;
  const allowApos = document.getElementById('opt-apostrophe').checked;
  const mixGender = document.getElementById('opt-mixgender').checked;

  const s = activeStyle;

  function getPool(g) {
    if (g === 'any' || mixGender) return [...(s.m||[]), ...(s.f||[]), ...(s.n||[])];
    return s[g] || s.n || s.m || [];
  }

  function filterName(name) {
    if (!allowApos && name.includes("'")) return false;
    if (length === 'short'  && name.replace(/[' ]/g,'').length > 5)  return false;
    if (length === 'medium' && (name.replace(/[' ]/g,'').length < 6 || name.replace(/[' ]/g,'').length > 9)) return false;
    if (length === 'long'   && name.replace(/[' ]/g,'').length < 10) return false;
    return true;
  }

  function buildName() {
    const pool = getPool(gender).filter(filterName);
    if (!pool.length) return null;

    const first = pick(pool);
    const sur   = s.surnames?.length ? pick(s.surnames) : '';
    const title = s.titles?.length   ? pick(s.titles)   : '';

    switch(format) {
      case 'full':     return sur ? `${first} ${sur}` : first;
      case 'sur':      return sur || first;
      case 'compound': {
        const pool2 = getPool(gender).filter(filterName);
        const second = pool2.length ? pick(pool2) : first;
        return `${first}-${second}`;
      }
      case 'title':    return title ? `${title} ${first}${sur ? ' '+sur : ''}` : first;
      default:         return first;
    }
  }

  const used = new Set();
  const out  = [];
  let attempts = 0;

  while (out.length < count && attempts < 500) {
    attempts++;
    const name = buildName();
    if (!name) break;
    if (uniqueOnly && used.has(name)) continue;
    used.add(name);
    out.push({ name, style: activeStyle.label, genre: activeStyle.genre, gender });
  }

  if (!out.length) { toast('No names for those settings — try relaxing filters!', 'error'); return; }

  results = out;
  renderResults();
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ══════════════════════════════════════════════
   RESULTS
══════════════════════════════════════════════ */
function renderResults() {
  const grid   = document.getElementById('results-grid');
  const empty  = document.getElementById('empty');
  const label  = document.getElementById('results-label');
  const copyAllBtn = document.getElementById('copy-all-btn');

  empty.style.display  = 'none';
  grid.style.display   = 'grid';
  copyAllBtn.style.display = '';

  label.textContent = `${results.length} names · ${activeStyle?.label || ''}`;

  grid.innerHTML = results.map((r, i) =>
    `<div class="result-card">
      <div>
        <div class="result-name">${esc(r.name)}</div>
        <div class="result-sub">${esc(r.style)} · ${esc(r.genre)}</div>
      </div>
      <div class="result-btns">
        <button class="btn btn-ghost btn-icon" onclick="saveName(${i})" title="Save name">
          <i data-lucide="heart" style="width:12px;height:12px"></i>
        </button>
        <button class="btn btn-ghost btn-icon" onclick="copyText('${escAttr(r.name)}')" title="Copy">
          <i data-lucide="copy" style="width:12px;height:12px"></i>
        </button>
      </div>
    </div>`
  ).join('');

  lucide.createIcons();
}

function clearResults() {
  results = [];
  document.getElementById('results-grid').style.display = 'none';
  document.getElementById('empty').style.display = '';
  document.getElementById('copy-all-btn').style.display = 'none';
  document.getElementById('results-label').textContent = 'Results';
}

function copyAll() {
  const text = results.map(r => r.name).join('\n');
  navigator.clipboard.writeText(text).then(() => toast(`Copied ${results.length} names!`, 'success'));
}

/* ══════════════════════════════════════════════
   SAVED / HISTORY
══════════════════════════════════════════════ */
function saveName(i) {
  const r = results[i];
  if (!r) return;
  if (savedNames.find(s => s.name === r.name)) { toast('Already saved!', 'error'); return; }
  savedNames.unshift({ ...r, savedAt: Date.now() });
  if (savedNames.length > 100) savedNames = savedNames.slice(0, 100);
  localStorage.setItem('ng_saved', JSON.stringify(savedNames));
  renderHistory();
  toast(`Saved "${r.name}"!`, 'success');
}

function renderHistory() {
  const scroll = document.getElementById('history-scroll');
  const empty  = document.getElementById('history-empty');

  if (!savedNames.length) {
    empty.style.display = '';
    scroll.querySelectorAll('.history-item').forEach(el => el.remove());
    return;
  }

  empty.style.display = 'none';
  const items = savedNames.map((s, i) =>
    `<div class="history-item">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:4px">
        <div>
          <div class="history-name">${esc(s.name)}</div>
          <div class="history-meta">${esc(s.style)}</div>
        </div>
        <div style="display:flex;gap:3px;flex-shrink:0">
          <button class="btn btn-ghost btn-icon" onclick="copyText('${escAttr(s.name)}')" title="Copy">
            <i data-lucide="copy" style="width:10px;height:10px"></i>
          </button>
          <button class="btn btn-ghost btn-icon" onclick="removeSaved(${i})" title="Remove">
            <i data-lucide="x" style="width:10px;height:10px"></i>
          </button>
        </div>
      </div>
    </div>`
  ).join('');

  // Replace content but keep the empty div
  const existing = scroll.querySelectorAll('.history-item');
  existing.forEach(el => el.remove());
  scroll.insertAdjacentHTML('beforeend', items);
  lucide.createIcons();
}

function removeSaved(i) {
  savedNames.splice(i, 1);
  localStorage.setItem('ng_saved', JSON.stringify(savedNames));
  renderHistory();
}

function clearHistory() {
  savedNames = [];
  localStorage.setItem('ng_saved', JSON.stringify(savedNames));
  renderHistory();
  toast('Saved names cleared', 'success');
}

/* ══════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════ */
function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast(`Copied!`, 'success'));
}
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  if (!s) return '';
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function toast(msg, type = 'success') {
  const c  = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

/* Keyboard shortcut */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generate();
});
